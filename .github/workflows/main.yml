name: Uygulamayı Exe Yap

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bagimliliklari yukle
        run: npm install

      - name: Portable exe olustur
        run: npm run dist

      - name: Exe dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Atolyesi-portable
          path: dist/*.exe

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
