<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>PDF Atölyesi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; worker-src 'self' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; connect-src 'self' blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://tessdata.projectnaptha.com;">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2a5bd7">
  <style>
    @media print {
      header, #empty, #toast, .modal-back, .bar, #editPanel, .mini-bar, .inline-ocr-wrap, .ocr-h, .ocr-drag {
        display: none !important;
      }
      #pages { padding: 0 !important; gap: 0 !important; }
      .sheet { box-shadow: none !important; margin: 0 auto; page-break-after: always; }
      .sheet canvas { position: static !important; }
      body::before { display: none !important; }
      @page { margin: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="g g-file">
      <label class="btn pri" for="file">PDF / Görsel aç</label>
      <input id="file" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" multiple hidden>
    </div>

    <div class="g" id="tools">
      <button data-t="select" aria-pressed="true">Gez</button>
      <button data-t="text" aria-pressed="false">Metin</button>
      <button data-t="hl" aria-pressed="false">Vurgula</button>
      <button data-t="pen" aria-pressed="false">Çiz</button>
      <button data-t="rect" aria-pressed="false">Dikdörtgen</button>
      <button data-t="white" aria-pressed="false">Beyaz kutu</button>
      <input id="color" type="color" value="#e5484d" aria-label="Çizim/Metin Rengi" title="Çizim/Metin Rengi">
      <div class="bg-wrap">
        <span class="bg-lbl">Zemin:</span>
        <input id="bgColor" type="color" class="bg-color" value="#ffffff" aria-label="Zemin Rengi" title="Sayfa Arka Plan Rengi">
      </div>
    </div>

    <div class="g g-view">
      <button id="undo" disabled title="Geri al">Geri al</button>
      <button id="zo" aria-label="Uzaklaştır">−</button>
      <button id="zfit" aria-label="Ekrana sığdır" title="Ekrana sığdır">Sığdır</button>
      <button id="zi" aria-label="Yakınlaştır">+</button>
    </div>

    <div class="sp"></div>
    <span class="ver"></span>

    <div class="g-actions">
      <button data-t="ocr" class="pri btn-edit" aria-pressed="false" id="btnEdit" disabled>Düzenle</button>
      <button id="btnConvert" class="sec" disabled title="PDF'i Word / Excel'e çevir (OCR + tablo algılama)">Word/Excel</button>
      <button id="print" class="sec" disabled title="Yazdır (Ctrl+P)">Yazdır</button>
      <button id="saveAs" class="sec" disabled>Farklı Kaydet</button>
      <button id="save" class="pri" disabled>Kaydet</button>
    </div>
  </header>

  <div id="empty">
    <h1>PDF veya görseli buraya bırakın</h1>
    <p>Dosyanız tarayıcıdan çıkmaz. <b>PDF, PNG, JPG</b> açabilir veya ekran görüntüsünü doğrudan <b>Ctrl+V</b> ile yapıştırıp düzenleyebilir ve Word/Excel'e çevirebilirsiniz.</p>
    <div class="acts">
      <label class="btn pri" for="file">PDF / Görsel seç</label>
      <button id="sample" class="sec">Örnek PDF oluştur</button>
    </div>
  </div>

  <main id="pages"></main>

  <!-- Sağ Biçimlendirme Paneli -->
  <aside id="editPanel" hidden aria-label="Metin biçimlendirme paneli">
    <div class="ep-head">
      <span class="ep-title">BİÇİMLENDİR</span>
      <span class="ep-badge" id="epBadge">Blok seçin</span>
    </div>

    <div class="ep-body" id="epControls">
      <div class="ep-group">
        <label class="ep-lbl" for="epFont">Yazı Tipi</label>
        <select id="epFont"></select>
      </div>

      <div class="ep-row">
        <div class="ep-group">
          <label class="ep-lbl" for="epSz">Boyut (pt)</label>
          <input type="number" id="epSz" min="6" max="120" step="0.5" value="12">
        </div>
        <div class="ep-group">
          <label class="ep-lbl" for="epFg">Renk</label>
          <div class="ep-color-box">
            <input type="color" id="epFg" value="#111111">
            <span id="epFgHex">#111111</span>
          </div>
        </div>
      </div>

      <div class="ep-group">
        <span class="ep-lbl">Stil</span>
        <div class="ep-seg">
          <button type="button" id="epB" title="Kalın"><b>B</b></button>
          <button type="button" id="epI" title="İtalik"><i>I</i></button>
        </div>
      </div>

      <div class="ep-group">
        <span class="ep-lbl">Hizalama</span>
        <div class="ep-seg" id="epAlignRow">
          <button type="button" data-al="left" title="Sola yasla"></button>
          <button type="button" data-al="center" title="Ortala"></button>
          <button type="button" data-al="right" title="Sağa yasla"></button>
          <button type="button" data-al="justify" title="İki yana yasla"></button>
          <button type="button" id="epIn" title="İlk satır girintisi"></button>
        </div>
      </div>

      <div class="ep-row">
        <div class="ep-group">
          <label class="ep-lbl" for="epLh">Satır Aralığı</label>
          <input type="number" id="epLh" min="0.9" max="3" step="0.05" value="1.25">
        </div>
        <div class="ep-group">
          <label class="ep-lbl" for="epBg">Zemin</label>
          <div class="ep-color-box">
            <input type="color" id="epBg" value="#ffffff">
            <span id="epBgHex">#ffffff</span>
          </div>
        </div>
      </div>

      <label class="ep-check" title="Arka plandaki filigranı silmeden sadece eski yazıyı temizler">
        <input type="checkbox" id="epWm"> Filigranı koru
      </label>
    </div>

    <div class="ep-foot">
      <div class="ep-count" id="epCount">Henüz değişiklik yok</div>
      <div class="ep-acts">
        <button type="button" class="sec" id="epDiscard" disabled>İptal</button>
        <button type="button" class="pri" id="epApplyAll" disabled>Tümünü Uygula</button>
      </div>
    </div>
  </aside>

  <div id="toast" role="alert" aria-live="assertive"></div>

  <!-- Harici Kütüphaneler -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>

  <!-- Uygulama Dosyaları -->
  <script src="app.js" defer></script>
  <script src="ocr.js" defer></script>
  <script src="export.js" defer></script>
  <script src="image-export.js" defer></script>
</body>
</html>
