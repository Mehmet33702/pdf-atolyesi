<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>PDF Atölyesi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; worker-src 'self' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; connect-src 'self' blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://tessdata.projectnaptha.com;">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
:root{--bg:#e8ebf1;--panel:#fff;--ink:#1b2333;--mute:#5d677b;--line:#cdd3de;--acc:#2a5bd7;--accink:#fff;--sheet:0 1px 2px rgba(20,30,50,.18),0 8px 24px rgba(20,30,50,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c27;--panel:#222a39;--ink:#e8ecf4;--mute:#9aa5ba;--line:#38425a;--acc:#7ea2ff;--accink:#10182b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171c27;--panel:#222a39;--ink:#e8ecf4;--mute:#9aa5ba;--line:#38425a;--acc:#7ea2ff;--accink:#10182b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:10}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;padding:8px 12px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
header .sp{flex:1;min-width:8px}
header .g{display:flex;gap:3px;align-items:center;padding:0 8px;border-left:1px solid var(--line);flex-shrink:0}
header .g:first-child{border:0;padding-left:0}
header .g-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
button,.btn{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0}
button:hover,.btn:hover{background:var(--bg)}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button[aria-pressed="true"]{background:var(--acc);color:var(--accink)}
button.pri,.btn.pri{background:var(--acc);color:var(--accink);font-weight:500}
button.sec,.btn.sec{background:var(--line);color:var(--ink);font-weight:500}
button:disabled{opacity:.4;cursor:default}
input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer;flex-shrink:0}
input[type=color].bg-color{border-radius:50%;width:26px;height:26px}
.bg-wrap{display:flex;align-items:center;gap:4px;margin-left:6px;border-left:1px solid var(--line);padding-left:8px}

.ver{font-size:12px;color:var(--mute);margin-left:10px;font-weight:500;user-select:none}

#empty{max-width:520px;margin:10vh auto 0;padding:32px 20px;text-align:center}
#empty h1{font-size:26px;line-height:1.2;margin:0 0 8px;font-weight:600}
#empty p{color:var(--mute);margin:0 0 24px}
#empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#empty.drag{outline:2px dashed var(--acc);outline-offset:-8px}
#pages{padding:16px 12px 140px;display:flex;flex-direction:column;align-items:center;gap:6px;overflow-x:auto}
.bar{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--mute);margin-top:10px;max-width:100%;flex-wrap:wrap}
.bar span{margin-right:auto}
.bar button{padding:4px 8px;font-size:13px}
.sheet{position:relative;background:#fff;box-shadow:var(--sheet);max-width:none;flex-shrink:0}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%}
.ov.off{pointer-events:none;touch-action:auto}
.ov.on{cursor:crosshair;touch-action:none}
.ti{position:absolute;margin:0;padding:2px 4px;border:1px dashed var(--acc);background:rgba(255,255,255,.92);font-family:"IBM Plex Sans",Arial,sans-serif;line-height:1.1;min-width:120px;outline:none;z-index:5}

/* Yüzer OCR Düzenleme Kartı */
.ocr-popover{
  position:absolute;
  z-index:30;
  width:min(420px, 92vw);
  background:var(--panel);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  box-shadow:0 12px 32px rgba(0,0,0,.22);
  display:flex;
  flex-direction:column;
  gap:8px;
}
.ocr-popover-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.ocr-popover-bar button{padding:4px 10px;font-size:13px;border:1px solid var(--line);border-radius:5px}
.ocr-popover-bar button.active{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.ocr-popover-bar input[type=number]{width:56px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}
.ocr-popover-bar input[type=color]{width:26px;height:26px;border-radius:4px}
.ocr-popover textarea{width:100%;min-height:68px;max-height:220px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:15px/1.4 "IBM Plex Sans",Arial,sans-serif;resize:vertical}
.ocr-popover-actions{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ocr-popover-hint{font-size:11px;color:var(--mute)}

/* Bildirim ve Hata Uyarıları */
#toast{
  position:fixed;
  right:20px;
  top:calc(62px + env(safe-area-inset-top,0px));
  background:#111827;
  color:#ffffff;
  padding:12px 18px;
  border-radius:8px;
  font-size:14px;
  font-weight:500;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateY(-10px);
  transition:opacity .25s ease, transform .25s ease, visibility .25s;
  max-width:360px;
  z-index:2147483647;
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
  border-left:4px solid #3b82f6;
}
#toast.err{border-left-color:#ef4444;background:#7f1d1d}
#toast.show{opacity:1;visibility:visible;transform:translateY(0)}

/* Mobil Uyumlu 2 Satırlı Üst Menü (≤ 768px) */
@media (max-width:768px){
  header{
    flex-wrap:wrap;
    overflow-x:visible;
    padding:6px 8px;
    gap:6px 4px;
    justify-content:space-between;
  }
  header .sp,.ver{display:none}
  header .g{border:0;padding:0;gap:3px}
  button,.btn{padding:6px 8px;min-height:34px;font-size:13px}

  .g-file{order:1}
  .g-view{order:2}
  .g-actions{order:3;gap:4px}

  #tools{
    order:4;
    flex-basis:100%;
    border-top:1px solid var(--line);
    padding-top:6px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    gap:4px;
  }
  #tools::-webkit-scrollbar{display:none}
  #tools button{
    border:1px solid var(--line);
    border-radius:16px;
    padding:5px 10px;
    background:var(--bg);
  }
  #tools button[aria-pressed="true"]{
    background:var(--acc);
    color:var(--accink);
    border-color:var(--acc);
  }

  #empty{margin-top:6vh;padding:24px 16px}
  #empty h1{font-size:22px}
  #pages{padding:10px 8px 160px}
  .bar{width:100% !important;padding:0 4px}
  .bar button{min-height:32px;padding:4px 9px;font-size:13px}
  .ti{font-size:16px !important}

  .ocr-popover{
    position:fixed !important;
    left:8px !important;
    right:8px !important;
    top:auto !important;
    bottom:calc(8px + env(safe-area-inset-bottom,0px)) !important;
    width:auto !important;
    max-height:58vh;
    overflow-y:auto;
    z-index:999;
    padding:12px;
  }
  .ocr-popover textarea,
  .ocr-popover-bar input[type=number]{font-size:16px}
  .ocr-popover-hint{display:none}
  .ocr-popover-actions{justify-content:flex-end}

  #toast{
    left:12px;
    right:12px;
    top:calc(12px + env(safe-area-inset-top,0px));
    bottom:auto;
    max-width:none;
    text-align:center;
    border-left:4px solid #3b82f6;
  }
  #toast.err{border-left-color:#ef4444}
}
</style>
</head>
<body>
<header>
  <div class="g g-file">
    <label class="btn pri" for="file">PDF aç</label>
    <input id="file" type="file" accept="application/pdf" hidden>
  </div>

  <div class="g" id="tools">
    <button data-t="select" aria-pressed="true">Gez</button>
    <button data-t="text" aria-pressed="false">Metin</button>
    <button data-t="hl" aria-pressed="false">Vurgula</button>
    <button data-t="pen" aria-pressed="false">Çiz</button>
    <button data-t="rect" aria-pressed="false">Dikdörtgen</button>
    <button data-t="white" aria-pressed="false">Beyaz kutu</button>
    <input id="color" type="color" value="#e5484d" aria-label="Çizim/Metin Rengi" title="Çizim/Metin Rengi">
    <div class="bg-wrap">
      <span style="font-size:12px;color:var(--mute);">Zemin:</span>
      <input id="bgColor" type="color" class="bg-color" value="#ffffff" aria-label="Zemin Rengi" title="Sayfa Arka Plan Rengi">
    </div>
  </div>

  <div class="g g-view">
    <button id="undo" disabled title="Geri al">Geri al</button>
    <button id="zo" aria-label="Uzaklaştır">−</button>
    <button id="zfit" aria-label="Ekrana sığdır" title="Ekrana sığdır">Sığdır</button>
    <button id="zi" aria-label="Yakınlaştır">+</button>
  </div>

  <div class="sp"></div>
  <span class="ver">v2.5.2</span>

  <div class="g-actions">
    <button data-t="ocr" class="pri" aria-pressed="false" id="btnEdit" disabled style="border:2px solid var(--ink);">Düzenle</button>
    <button id="saveAs" class="sec" disabled>Farklı Kaydet</button>
    <button id="save" class="pri" disabled>Kaydet</button>
  </div>
</header>

<div id="empty">
  <h1>PDF’i buraya bırakın</h1>
  <p>Dosyanız tarayıcıdan çıkmaz. <b>Düzenle</b> butonuna bastığınızda tüm metin kutuları otomatik belirir; tıklayarak veya kutu çizerek canlı önizlemeyle düzenleyin.</p>
  <div class="acts">
    <label class="btn pri" for="file">PDF seç</label>
    <button id="sample" class="sec">Örnek PDF oluştur</button>
  </div>
</div>
<main id="pages"></main>
<div id="toast" role="alert" aria-live="assertive"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
const $=s=>document.querySelector(s);
const isMobile=()=>window.innerWidth<=768;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const S={bytes:null,doc:null,name:'belge.pdf',pgs:[],zoom:1.2,tool:'select',hist:[]};
let io=null,tt,activeEditorClose=null;

function toast(m,isErr=false){
  const t=$('#toast');
  t.textContent=m;
  t.classList.toggle('err',!!isErr);
  t.classList.add('show');
  clearTimeout(tt);
  tt=setTimeout(()=>t.classList.remove('show'),4000);
}
const rotOf=pg=>(pg.base+pg.rot)%360;

function calcFitZoom(){
  if(!S.pgs.length)return 1.2;
  const pg=S.pgs[0],R=rotOf(pg),pw=R%180?pg.h:pg.w;
  const avail=Math.max(260,window.innerWidth-(isMobile()?18:48));
  return Math.min(isMobile()?1.4:1.3,Math.max(0.35,+(avail/pw).toFixed(2)));
}

async function load(bytes,name){
  try{
    if(activeEditorClose)activeEditorClose(true);
    if(S.doc){try{await S.doc.destroy()}catch(_){}}
    const doc=await pdfjsLib.getDocument({data:bytes.slice(),isEvalSupported:false}).promise;
    S.bytes=bytes;S.doc=doc;S.name=name||'belge.pdf';S.hist=[];S.pgs=[];
    for(let i=1;i<=doc.numPages;i++){
      const p=await doc.getPage(i),v=p.getViewport({scale:1,rotation:0});
      S.pgs.push({n:i,rot:0,base:p.rotate,w:v.width,h:v.height,shapes:[],preview:[],ocrCache:null,ocrLoading:false,hoverBox:null});
    }
    S.zoom=calcFitZoom();
    $('#empty').hidden=true;$('#save').disabled=false;$('#saveAs').disabled=false;$('#btnEdit').disabled=false;
    build();
  }catch(e){toast('Bu PDF açılamadı. Parola korumalı ya da bozuk olabilir.',true)}
}

function build(){
  if(activeEditorClose)activeEditorClose(true);
  const box=$('#pages');box.innerHTML='';
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);draw(e.target._pg,e.target)}}),{rootMargin:'600px'});
  S.pgs.forEach((pg,i)=>{
    const R=rotOf(pg),sw=(R%180?pg.h:pg.w)*S.zoom,sh=(R%180?pg.w:pg.h)*S.zoom;
    const bar=document.createElement('div');bar.className='bar';bar.style.width=sw+'px';
    const lbl=document.createElement('span');lbl.textContent='Sayfa '+(i+1)+' / '+S.pgs.length;
    bar.appendChild(lbl);
    [['Döndür',()=>rotate(pg)],['Sil',()=>del(i)],['↑',()=>move(i,-1)],['↓',()=>move(i,1)]].forEach(([l,f],k)=>{
      const b=document.createElement('button');b.textContent=l;b.onclick=f;
      if(k==2)b.setAttribute('aria-label','Yukarı taşı');if(k==3)b.setAttribute('aria-label','Aşağı taşı');
      bar.appendChild(b)});
    const sheet=document.createElement('div');sheet.className='sheet';sheet.style.width=sw+'px';sheet.style.height=sh+'px';
    sheet._pg=pg;
    box.append(bar,sheet);io.observe(sheet);
  });
  setTool(S.tool,true);upd();
}

async function draw(pg,sheet){
  const dpr=Math.min(window.devicePixelRatio||1,2),R=rotOf(pg);
  const page=await S.doc.getPage(pg.n),vp=page.getViewport({scale:S.zoom*dpr,rotation:R});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  const ov=document.createElement('canvas');ov.className='ov';ov.width=vp.width;ov.height=vp.height;
  sheet.append(c,ov);pg.ov=ov;pg.baseCanvas=c;
  bind(ov,pg);paint(pg);setTool(S.tool,true);
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  if(S.tool==='ocr')ensureOcrCache(pg);
}

function shapes(ctx,list,W,H){
  const lw=W*.003;
  for(const s of list){
    ctx.save();ctx.lineWidth=lw;ctx.lineCap=ctx.lineJoin='round';
    if(s.t=='hl'){ctx.globalAlpha=.4;ctx.fillStyle='#ffd60a';ctx.fillRect(s.x*W,s.y*H,s.w*W,s.h*H)}
    else if(s.t=='white'){ctx.fillStyle=s.c||'#fff';ctx.fillRect(s.x*W,s.y*H,s.w*W,s.h*H)}
    else if(s.t=='rect'){ctx.strokeStyle=s.c;ctx.strokeRect(s.x*W,s.y*H,s.w*W,s.h*H)}
    else if(s.t=='sel'){
      ctx.fillStyle='rgba(42,91,215,0.12)';ctx.fillRect(s.x*W,s.y*H,s.w*W,s.h*H);
      ctx.strokeStyle='#2a5bd7';ctx.setLineDash([6,4]);ctx.strokeRect(s.x*W,s.y*H,s.w*W,s.h*H);
    }
    else if(s.t=='pen'){ctx.strokeStyle=s.c;ctx.beginPath();s.p.forEach(([x,y],i)=>i?ctx.lineTo(x*W,y*H):ctx.moveTo(x*W,y*H));ctx.stroke()}
    else if(s.t=='text'){
      ctx.fillStyle=s.c;ctx.textBaseline='top';
      const style=(s.italic?'italic ':'')+(s.bold?'700 ':'400 ');
      const px=s.size*W;
      ctx.font=`${style}${px}px "IBM Plex Sans",Arial,sans-serif`;
      const lh=px*(s.lh||1.25);
      s.s.split('\n').forEach((l,i)=>ctx.fillText(l,s.x*W,s.y*H+i*lh));
    }
    ctx.restore();
  }
}

function paint(pg){
  const ov=pg.ov;if(!ov)return;
  const ctx=ov.getContext('2d'),R=rotOf(pg),cw=ov.width,ch=ov.height;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cw,ch);
  if(R==90){ctx.translate(cw,0);ctx.rotate(Math.PI/2)}
  else if(R==180){ctx.translate(cw,ch);ctx.rotate(Math.PI)}
  else if(R==270){ctx.translate(0,ch);ctx.rotate(-Math.PI/2)}
  const W=R%180?ch:cw,H=R%180?cw:ch;

  shapes(ctx,pg.shapes,W,H);

  if(S.tool==='ocr' && pg.ocrCache){
    ctx.save();
    const pxLine=Math.max(1,W/900);
    for(const seg of pg.ocrCache){
      const isHover=(pg.hoverBox===seg);
      const x=seg.x*W,y=seg.y*H,w=seg.w*W,h=seg.h*H;
      if(isHover){
        ctx.fillStyle='rgba(42,91,215,0.08)';
        ctx.fillRect(x,y,w,h);
        ctx.strokeStyle='#2a5bd7';
        ctx.lineWidth=pxLine*1.6;
      }else{
        ctx.strokeStyle='rgba(115,128,148,0.55)';
        ctx.lineWidth=pxLine;
      }
      ctx.strokeRect(x,y,w,h);
    }
    ctx.restore();
  }

  if(pg.preview&&pg.preview.length)shapes(ctx,pg.preview,W,H);
}

const toRaw=(R,u,v)=>R==90?[v,1-u]:R==180?[1-u,1-v]:R==270?[1-v,u]:[u,v];
const fromRaw=(R,x,y)=>R==90?[1-y,x]:R==180?[1-x,1-y]:R==270?[y,1-x]:[x,y];
const paintAll=()=>S.pgs.forEach(paint);

function hitTestOcr(pg,x,y){
  if(!pg.ocrCache)return null;
  let target=null,minArea=Infinity;
  for(const seg of pg.ocrCache){
    const px=Math.max(0.004,seg.w*0.04),py=Math.max(0.003,seg.h*0.22);
    if(x>=seg.x-px&&x<=seg.x+seg.w+px&&y>=seg.y-py&&y<=seg.y+seg.h+py){
      const a=seg.w*seg.h;
      if(a<minArea){minArea=a;target=seg}
    }
  }
  return target;
}

function bind(ov,pg){
  let dragging=false;

  ov.addEventListener('pointermove',e=>{
    if(S.tool!=='ocr'||dragging||e.pointerType==='touch')return;
    const r=ov.getBoundingClientRect(),R=rotOf(pg);
    const [x,y]=toRaw(R,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
    const hit=hitTestOcr(pg,x,y);
    if(hit!==pg.hoverBox){
      pg.hoverBox=hit;
      ov.style.cursor=hit?'text':'crosshair';
      paint(pg);
    }
  });
  ov.addEventListener('pointerleave',()=>{
    if(pg.hoverBox){pg.hoverBox=null;paint(pg)}
  });

  ov.addEventListener('pointerdown',e=>{
    const t=S.tool;if(t=='select')return;
    e.preventDefault();
    const r=ov.getBoundingClientRect(),R=rotOf(pg);
    const P=ev=>toRaw(R,(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height);
    const [x0,y0]=P(e);

    if(t=='ocr'){
      if(activeEditorClose)activeEditorClose(true);
      dragging=true;
      const sel={t:'sel',x:x0,y:y0,w:0,h:0};
      pg.preview=[sel];ov.setPointerCapture(e.pointerId);
      const mv=ev=>{
        const [x,y]=P(ev);
        sel.x=Math.min(x0,x);sel.y=Math.min(y0,y);
        sel.w=Math.abs(x-x0);sel.h=Math.abs(y-y0);
        paint(pg);
      };
      const up=()=>{
        dragging=false;
        ov.removeEventListener('pointermove',mv);ov.removeEventListener('pointerup',up);ov.removeEventListener('pointercancel',up);
        pg.preview=[];paint(pg);
        if(sel.w>0.015 && sel.h>0.01){
          ocrRegionEdit(pg,sel,R);
        }else{
          const hit=hitTestOcr(pg,x0,y0);
          if(hit)openFloatingOcrEditor(pg,hit,R);
          else ensureOcrCache(pg).then(()=>{
            const h2=hitTestOcr(pg,x0,y0);
            if(h2)openFloatingOcrEditor(pg,h2,R);
            else toast('Burada metin kutusu yok. Parmağınızla/fareyle kutu çizin.');
          });
        }
      };
      ov.addEventListener('pointermove',mv);ov.addEventListener('pointerup',up);ov.addEventListener('pointercancel',up);
      return;
    }

    const c=$('#color').value;
    if(t=='text')return addText(ov,pg,e,x0,y0,c);

    const curColor=t=='white'?$('#bgColor').value:c;
    const cur=t=='pen'?{t,c:curColor,p:[[x0,y0]]}:{t,c:curColor,x:x0,y:y0,w:0,h:0};

    pg.shapes.push(cur);ov.setPointerCapture(e.pointerId);
    const mv=ev=>{const [x,y]=P(ev);
      if(t=='pen')cur.p.push([x,y]);
      else{cur.x=Math.min(x0,x);cur.y=Math.min(y0,y);cur.w=Math.abs(x-x0);cur.h=Math.abs(y-y0)}
      paint(pg)};
    const up=()=>{ov.removeEventListener('pointermove',mv);ov.removeEventListener('pointerup',up);ov.removeEventListener('pointercancel',up);
      const tiny=t=='pen'?cur.p.length<2:cur.w<.004||cur.h<.004;
      if(tiny)pg.shapes.pop();else push(()=>pg.shapes.splice(pg.shapes.indexOf(cur),1));
      paint(pg)};
    ov.addEventListener('pointermove',mv);ov.addEventListener('pointerup',up);ov.addEventListener('pointercancel',up);
  });
}

function addText(ov,pg,e,x,y,c){
  const sh=ov.parentElement,r=ov.getBoundingClientRect(),R=rotOf(pg),size=.022;
  const rw=R%180?r.height:r.width;
  const inp=document.createElement('input');inp.className='ti';
  inp.style.left=Math.min(r.width-130,Math.max(4,e.clientX-r.left))+'px';
  inp.style.top=(e.clientY-r.top)+'px';
  inp.style.fontSize=(size*rw)+'px';inp.style.color=c;
  sh.appendChild(inp);setTimeout(()=>inp.focus(),0);
  let done=false;
  const fin=()=>{if(done)return;done=true;const v=inp.value.trim();inp.remove();
    if(v){const s={t:'text',c,x,y,s:v,size};pg.shapes.push(s);push(()=>pg.shapes.splice(pg.shapes.indexOf(s),1));paint(pg)}};
  inp.onblur=fin;
  inp.onkeydown=ev=>{if(ev.key=='Enter')inp.blur();if(ev.key=='Escape'){inp.value='';inp.blur()}};
}

function push(f,full){S.hist.push({f,full});upd()}
function upd(){$('#undo').disabled=!S.hist.length}
$('#undo').onclick=undo;
function undo(){const h=S.hist.pop();if(!h)return;h.f();h.full?build():paintAll();upd()}
addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.matches('input,textarea')){
    e.preventDefault();undo();
  }
});

function rotate(pg){pg.rot=(pg.rot+90)%360;push(()=>{pg.rot=(pg.rot+270)%360},true);build()}
function del(i){
  if(S.pgs.length<2)return toast('Son sayfa silinemez.',true);
  const [pg]=S.pgs.splice(i,1);push(()=>S.pgs.splice(i,0,pg),true);build();
}
function move(i,d){
  const j=i+d;if(j<0||j>=S.pgs.length)return;
  const sw=()=>{[S.pgs[i],S.pgs[j]]=[S.pgs[j],S.pgs[i]]};sw();push(sw,true);build();
}

function setTool(t,silent){
  S.tool=t;
  if(t!=='ocr'&&activeEditorClose)activeEditorClose(true);
  document.querySelectorAll('#tools [data-t], #btnEdit').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t==t));
  document.querySelectorAll('.ov').forEach(o=>{
    o.classList.toggle('off',t=='select');
    o.classList.toggle('on',t!='select');
    if(t!=='ocr')o.style.cursor='';
  });
  paintAll();
  if(t==='ocr'&&!silent){
    S.pgs.forEach(pg=>{if(pg.baseCanvas)ensureOcrCache(pg)});
  }
}
$('#tools').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b&&!b.disabled)setTool(b.dataset.t)});
$('#btnEdit').onclick=()=>setTool(S.tool=='ocr'?'select':'ocr');

function zoom(d){S.zoom=Math.min(3,Math.max(.35,+(S.zoom+d).toFixed(2)));if(S.doc)build()}
$('#zi').onclick=()=>zoom(.2);
$('#zo').onclick=()=>zoom(-.2);
$('#zfit').onclick=()=>{if(!S.doc)return;S.zoom=calcFitZoom();build()};

/* ---------- OCR (Tesseract.js, Türkçe) ---------- */
let ocrWorker=null,ocrWorkerLoading=null;
async function getOcrWorker(){
  if(ocrWorker)return ocrWorker;
  if(ocrWorkerLoading)return ocrWorkerLoading;
  ocrWorkerLoading=(async()=>{
    toast('Türkçe OCR modeli yükleniyor...');
    const w=await Tesseract.createWorker('tur',1);
    ocrWorker=w;ocrWorkerLoading=null;
    return w;
  })();
  return ocrWorkerLoading;
}

async function ensureOcrCache(pg){
  if(pg.ocrCache||pg.ocrLoading)return;
  pg.ocrLoading=true;
  const c=document.createElement('canvas');
  try{
    toast(`Sayfa ${pg.n} metin kutuları hazırlanıyor...`);
    const w=await getOcrWorker();
    const page=await S.doc.getPage(pg.n);
    const vp=page.getViewport({scale:isMobile()?1.6:2,rotation:0});
    c.width=vp.width;c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;

    const {data}=await w.recognize(c);
    const cw=c.width,ch=c.height;
    const boxes=[];

    for(const ln of (data.lines||[])){
      const words=(ln.words||[]).filter(wd=>wd.text&&wd.text.trim());
      if(!words.length)continue;
      let seg=[words[0]];
      const flush=()=>{
        let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
        for(const wd of seg){
          x0=Math.min(x0,wd.bbox.x0/cw);y0=Math.min(y0,wd.bbox.y0/ch);
          x1=Math.max(x1,wd.bbox.x1/cw);y1=Math.max(y1,wd.bbox.y1/ch);
        }
        boxes.push({
          text:seg.map(wd=>wd.text.trim()).join(' '),
          x:x0,y:y0,w:x1-x0,h:y1-y0,lineH:y1-y0
        });
      };
      for(let i=1;i<words.length;i++){
        const prev=words[i-1].bbox,cur=words[i].bbox;
        const h=Math.max(prev.y1-prev.y0,cur.y1-cur.y0);
        const gap=cur.x0-prev.x1;
        if(gap>h*1.8){flush();seg=[words[i]]}
        else seg.push(words[i]);
      }
      flush();
    }

    pg.ocrCache=boxes;
    paint(pg);
    toast(`Sayfa ${pg.n} düzenlemeye hazır. Bir kutuya dokunun.`);
  }catch(err){
    console.error(err);toast('OCR hatası: '+err.message,true);
  }finally{
    c.width=0;c.height=0;
    pg.ocrLoading=false;
  }
}

function sampleBgColor(pg,box,R){
  const c=pg.baseCanvas;if(!c)return $('#bgColor').value;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  const cw=c.width,ch=c.height;
  const corners=[
    fromRaw(R,box.x,box.y),fromRaw(R,box.x+box.w,box.y),
    fromRaw(R,box.x,box.y+box.h),fromRaw(R,box.x+box.w,box.y+box.h)
  ];
  const xs=corners.map(p=>p[0]*cw),ys=corners.map(p=>p[1]*ch);
  const x0=Math.max(0,Math.floor(Math.min(...xs))-3),y0=Math.max(0,Math.floor(Math.min(...ys))-3);
  const x1=Math.min(cw-1,Math.ceil(Math.max(...xs))+3),y1=Math.min(ch-1,Math.ceil(Math.max(...ys))+3);
  const rs=[],gs=[],bs=[];
  const px=(x,y)=>{const d=ctx.getImageData(x,y,1,1).data;rs.push(d[0]);gs.push(d[1]);bs.push(d[2])};
  const sx=Math.max(1,Math.floor((x1-x0)/10)),sy=Math.max(1,Math.floor((y1-y0)/6));
  for(let x=x0;x<=x1;x+=sx){px(x,y0);px(x,y1)}
  for(let y=y0;y<=y1;y+=sy){px(x0,y);px(x1,y)}
  if(!rs.length)return $('#bgColor').value;
  const med=a=>{a.sort((x,y)=>x-y);return a[Math.floor(a.length/2)]};
  const r=med(rs),g=med(gs),b=med(bs);
  if(r>240&&g>240&&b>240)return '#ffffff';
  const hx=n=>n.toString(16).padStart(2,'0');
  return `#${hx(r)}${hx(g)}${hx(b)}`;
}

async function ocrRegionEdit(pg,sel,R){
  const full=document.createElement('canvas'),crop=document.createElement('canvas');
  try{
    toast('Seçilen bölge okunuyor...');
    const w=await getOcrWorker();
    const page=await S.doc.getPage(pg.n);
    const vp=page.getViewport({scale:isMobile()?2:3,rotation:0});
    full.width=vp.width;full.height=vp.height;
    await page.render({canvasContext:full.getContext('2d'),viewport:vp}).promise;

    const sx=Math.max(0,Math.floor(sel.x*full.width));
    const sy=Math.max(0,Math.floor(sel.y*full.height));
    const sw=Math.max(10,Math.min(full.width-sx,Math.ceil(sel.w*full.width)));
    const sh=Math.max(10,Math.min(full.height-sy,Math.ceil(sel.h*full.height)));

    crop.width=sw;crop.height=sh;
    crop.getContext('2d').drawImage(full,sx,sy,sw,sh,0,0,sw,sh);

    const {data}=await w.recognize(crop);
    const text=(data.text||'').trim().replace(/\n{2,}/g,'\n');
    const lines=(data.lines||[]).filter(l=>l.text&&l.text.trim());

    let estLineH=sel.h;
    if(lines.length){
      const hs=lines.map(l=>(l.bbox.y1-l.bbox.y0)/full.height).filter(h=>h>0.004);
      if(hs.length)estLineH=hs.reduce((a,b)=>a+b,0)/hs.length;
    }

    openFloatingOcrEditor(pg,{text,x:sel.x,y:sel.y,w:sel.w,h:sel.h,lineH:estLineH},R);
  }catch(err){
    console.error(err);toast('Bölge okunamadı: '+err.message,true);
  }finally{
    full.width=0;full.height=0;crop.width=0;crop.height=0;
  }
}

function openFloatingOcrEditor(pg,box,R){
  if(activeEditorClose)activeEditorClose(true);
  const sheet=pg.ov.parentElement;

  const detectedBg=sampleBgColor(pg,box,R);
  $('#bgColor').value=detectedBg;
  const initColor=isDarkColor(detectedBg)?'#ffffff':'#111111';
  const initFontPx=Math.max(8,Math.round(box.lineH*pg.h*0.88));

  const state={text:box.text,fontPx:initFontPx,bold:false,italic:false,color:initColor,bg:detectedBg};

  const pop=document.createElement('div');
  pop.className='ocr-popover';
  pop.innerHTML=`
    <div class="ocr-popover-bar">
      <label style="display:flex;align-items:center;gap:4px">Boyut:
        <input type="number" id="ocrSz" min="6" max="120" value="${state.fontPx}">
      </label>
      <button type="button" id="ocrB" title="Kalın"><b>B</b></button>
      <button type="button" id="ocrI" title="İtalik"><i>I</i></button>
      <label style="display:flex;align-items:center;gap:3px">Yazı:<input type="color" id="ocrFg" value="${state.color}"></label>
      <label style="display:flex;align-items:center;gap:3px">Zemin:<input type="color" id="ocrBg" value="${state.bg}"></label>
    </div>
    <textarea id="ocrTa" placeholder="Metni buraya yazın (boş bırakırsanız alan silinir)..."></textarea>
    <div class="ocr-popover-actions">
      <span class="ocr-popover-hint">Ctrl+Enter: Uygula • Esc: İptal</span>
      <div style="display:flex;gap:6px">
        <button type="button" class="sec" id="ocrCancel">İptal</button>
        <button type="button" class="pri" id="ocrApply">Uygula ✓</button>
      </div>
    </div>
  `;

  if(isMobile()){
    document.body.appendChild(pop);
  }else{
    const [sx0,sy0]=fromRaw(R,box.x,box.y);
    const [sx1,sy1]=fromRaw(R,box.x+box.w,box.y+box.h);
    const leftPx=Math.max(8,Math.min(sheet.clientWidth-430,Math.min(sx0,sx1)*sheet.clientWidth));
    const topPx=Math.max(sy0,sy1)*sheet.clientHeight+10;
    pop.style.left=leftPx+'px';
    pop.style.top=topPx+'px';
    sheet.appendChild(pop);
  }

  const ta=pop.querySelector('#ocrTa');
  const szInp=pop.querySelector('#ocrSz');
  const btnB=pop.querySelector('#ocrB');
  const btnI=pop.querySelector('#ocrI');
  const fgInp=pop.querySelector('#ocrFg');
  const bgInp=pop.querySelector('#ocrBg');
  ta.value=state.text;

  const buildShapes=()=>{
    const padX=0.002,padY=0.002;
    const cover={
      t:'white',c:state.bg,
      x:Math.max(0,box.x-padX),y:Math.max(0,box.y-padY),
      w:box.w+padX*2,h:box.h+padY*2
    };
    const out=[cover];
    if(state.text.trim()){
      out.push({
        t:'text',c:state.color,
        x:box.x,y:box.y,
        s:state.text,
        size:state.fontPx/pg.w,
        bold:state.bold,italic:state.italic,lh:1.25
      });
    }
    return out;
  };

  const renderPreview=()=>{
    pg.preview=[...buildShapes(),{t:'sel',x:box.x,y:box.y,w:box.w,h:box.h}];
    paint(pg);
  };

  ta.oninput=()=>{state.text=ta.value;renderPreview()};
  szInp.oninput=()=>{state.fontPx=Math.max(6,Number(szInp.value)||12);renderPreview()};
  btnB.onclick=()=>{state.bold=!state.bold;btnB.classList.toggle('active',state.bold);renderPreview()};
  btnI.onclick=()=>{state.italic=!state.italic;btnI.classList.toggle('active',state.italic);renderPreview()};
  fgInp.oninput=()=>{state.color=fgInp.value;renderPreview()};
  bgInp.oninput=()=>{state.bg=bgInp.value;$('#bgColor').value=state.bg;renderPreview()};

  const close=(cancel)=>{
    activeEditorClose=null;
    if(pop.parentNode)pop.remove();
    pg.preview=[];
    if(!cancel){
      const added=buildShapes();
      const prevText=box.text;
      box.text=state.text.trim();
      pg.shapes.push(...added);
      push(()=>{
        for(const s of added){const idx=pg.shapes.indexOf(s);if(idx>=0)pg.shapes.splice(idx,1)}
        box.text=prevText;
      });
      toast('Metin güncellendi.');
    }
    paint(pg);
  };
  activeEditorClose=close;

  pop.querySelector('#ocrCancel').onclick=()=>close(true);
  pop.querySelector('#ocrApply').onclick=()=>close(false);
  ta.onkeydown=ev=>{
    if(ev.key==='Escape'){ev.preventDefault();close(true)}
    if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();close(false)}
  };

  renderPreview();
  ta.focus();
  ta.setSelectionRange(ta.value.length,ta.value.length);
}

function isDarkColor(hex){
  const c=hex.substring(1),rgb=parseInt(c,16);
  return (0.2126*((rgb>>16)&255)+0.7152*((rgb>>8)&255)+0.0722*(rgb&255))<128;
}

/* ---------- Kaydet (Vektör Kapama + Yerel Tarayıcı İndirmesi) ---------- */
async function save(asNew){
  if(activeEditorClose)activeEditorClose(false);
  const {PDFDocument,degrees,rgb}=PDFLib,btn=$(asNew?'#saveAs':'#save');btn.disabled=true;
  const hexToRgb=h=>{
    const n=parseInt((h||'#ffffff').slice(1),16);
    return rgb(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255);
  };
  try{
    const src=await PDFDocument.load(S.bytes,{ignoreEncryption:true}),out=await PDFDocument.create();
    const cps=await out.copyPages(src,S.pgs.map(p=>p.n-1));
    for(let i=0;i<S.pgs.length;i++){
      const pg=S.pgs[i],p=cps[i];out.addPage(p);p.setRotation(degrees(rotOf(pg)));
      if(pg.shapes.length){
        const mb=p.getMediaBox();

        // 1) Kapama kutularını kenar izi olmadan doğrudan vektör çiz
        for(const s of pg.shapes){
          if(s.t==='white'){
            const rw=s.w*mb.width,rh=s.h*mb.height;
            p.drawRectangle({
              x:mb.x+s.x*mb.width,
              y:mb.y+mb.height-(s.y*mb.height)-rh,
              width:rw,
              height:rh,
              color:hexToRgb(s.c),
              borderWidth:0
            });
          }
        }

        // 2) Metin ve diğer çizimleri şeffaf katman olarak üzerine ekle
        const rest=pg.shapes.filter(s=>s.t!=='white');
        if(rest.length){
          const k=2,c=document.createElement('canvas');c.width=pg.w*k;c.height=pg.h*k;
          shapes(c.getContext('2d'),rest,c.width,c.height);
          const blob=await new Promise(r=>c.toBlob(r,'image/png'));
          c.width=0;c.height=0;
          const img=await out.embedPng(new Uint8Array(await blob.arrayBuffer()));
          p.drawImage(img,{x:mb.x,y:mb.y,width:mb.width,height:mb.height});
        }
      }
    }
    const data=await out.save();
    const fname=S.name.replace(/\.pdf$/i,'')+(asNew?'-kopya':'-duzenlendi')+'.pdf';

    const url=URL.createObjectURL(new Blob([data],{type:'application/pdf'}));
    const a=document.createElement('a');a.href=url;a.download=fname;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast(asNew?'Yeni dosya kaydedildi.':'Kaydedildi.');
  }catch(e){toast('Kaydedilemedi: '+(e&&e.message||'bilinmeyen hata'),true)}
  btn.disabled=false;
}
$('#save').onclick=()=>save(false);
$('#saveAs').onclick=()=>save(true);

async function open(f){
  if(!f)return;
  if(f.type&&f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){
    return toast('Lütfen geçerli bir PDF dosyası seçin.',true);
  }
  load(new Uint8Array(await f.arrayBuffer()),f.name);
}
$('#file').onchange=e=>{open(e.target.files[0]);e.target.value=''};
addEventListener('dragover',e=>{e.preventDefault();$('#empty').classList.add('drag')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#empty').classList.remove('drag')});
addEventListener('drop',e=>{e.preventDefault();$('#empty').classList.remove('drag');open(e.dataTransfer.files[0])});

$('#sample').onclick=async()=>{
  const {PDFDocument,StandardFonts,rgb}=PDFLib,d=await PDFDocument.create(),f=await d.embedFont(StandardFonts.Helvetica);
  ['Ornek belge','Ikinci sayfa'].forEach(t=>{
    const p=d.addPage([595,842]);

    p.drawText('Metin, vurgu ve cizim araclarini bu sayfada deneyin.',{x:60,y:720,size:13,font:f});
    p.drawRectangle({x:60,y:520,width:475,height:160,borderColor:rgb(.6,.65,.75),borderWidth:1});
  });
  load(await d.save(),'ornek.pdf');
};
